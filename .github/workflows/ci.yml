name: ci
on: [push, pull_request]

jobs:
  sweep:
    name: the sweep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Tauri crate links against the system webview on Linux.
      - name: the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      # The whole sweep: the frontend checks, the Rust checks and the
      # privacy verifier, one PASS/FAIL line per check.
      - name: the sweep
        run: bash scripts/verify.sh
