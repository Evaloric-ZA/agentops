name: ci
on: [push, pull_request]

# One run per ref. A newer push supersedes an older one instead of
# competing with it for a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: the sweep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The actions are pinned to a commit, not to a tag, so a moved tag
      # cannot change what the build runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      # Pinned to a commit, so the `toolchain` input has to be given
      # explicitly: the action reads the toolchain from its input, not
      # from the ref it is referenced by.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy

      # The Tauri crate links against the system webview on Linux.
      - name: the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      # The whole sweep: the frontend checks, the Rust checks, the version
      # check, the scanner's own test, the native build and the privacy
      # verifier. One PASS/FAIL/SKIP line per check.
      #
      # The checks themselves live in scripts/verify.py, so the two
      # entry points below run the same checks in the same order. The
      # shell one is for macOS and Linux; the PowerShell one is for
      # Windows, where there is no shell to run the other.
      - name: the sweep
        if: runner.os != 'Windows'
        run: bash scripts/verify.sh

      - name: the sweep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1

  windows-app:
    name: the Windows application
    # The sweep compiles and links the application on Windows, but it
    # deliberately does not bundle it. This job is the one that proves
    # the installers can be produced: it runs the Tauri bundler, which
    # is the part that needs the WebView2 loader, the icon, WiX and
    # NSIS.
    #
    # It is its own job rather than another step in the matrix, so that
    # a bundling failure is visible on its own and cannot be masked by
    # a sweep that passed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable

      # The lockfile on its own, and nothing from a previous build.
      - name: the frontend dependencies
        run: npm ci

      # `cargo tauri ...` invokes a binary named `cargo-tauri`, and Cargo
      # looks for it on the PATH. The npm CLI installs the Tauri CLI
      # into node_modules/.bin under the name `tauri`, so the bridge
      # that connects the two is created here. It is the same script the
      # sweep uses.
      - name: the cargo tauri bridge
        run: python scripts/ensure_cargo_tauri.py

      # The bundler itself. This is the step that was not covered.
      - name: the Windows installers
        shell: pwsh
        run: |
          npm run tauri -- build --debug

      # The installers are the deliverable, so they are named rather
      # than left in the log to be found.
      - name: the installers that were produced
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path src-tauri\target\debug\bundle -Recurse -Include *.msi,*.exe
          if (-not $installers) {
            Write-Output "FAIL: no installer was produced"
            exit 1
          }
          $installers | Select-Object FullName, Length | Format-Table -AutoSize

  msrv:
    name: the minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      # The version in src-tauri/Cargo.toml's rust-version field. If this
      # job fails, either the declared minimum has risen and the field
      # must be updated, or the minimum is no longer true.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.90"

      - name: the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      - name: it compiles on the minimum supported Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  security:
    name: the security gate
    # The release security gate. It is its own job, independently of
    # the compile and unit-test jobs, so that a security failure is
    # visible on its own and cannot be masked by a passing build.
    #
    # It runs the two dependency gates in release mode, the two
    # allowlist validators and the privacy scanner. If any of the
    # tooling cannot initialise, the job fails: a security control that
    # did not run is not a security control that passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable

      # The audit tool is pinned to an exact version. A hosted runner's
      # own copy is never trusted, and `cargo install cargo-audit`
      # without a version would install whatever happened to be newest
      # on the day the job ran, which makes the gate a moving target.
      # This step is also the one that fails if the tool cannot be
      # built, and the version it installed is recorded in the log.
      - name: the pinned cargo-audit
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --version

      - name: the JavaScript dependencies
        run: npm ci --no-audit --no-fund

      # The npm gate, in release mode. A Critical or a High advisory
      # fails it, an expired exception fails it, and a registry that
      # cannot be reached fails it rather than skipping it.
      - name: the npm dependency gate
        run: python3 scripts/npm_audit_gate.py --release .

      # The Rust gate, in release mode, with the pinned tool and the
      # allowlist that says which advisories are accepted and until
      # when each of them has to be looked at again.
      - name: the Rust dependency gate
        run: python3 scripts/rust_audit_gate.py --release .

      # The gates' own regression test: it proves the rules fail when
      # they should, without needing a registry or an advisory database
      # to produce a finding.
      - name: the audit policy's regression test
        run: python3 scripts/test_audit_policy.py

      - name: the privacy scanner's regression test
        run: python3 scripts/test_verify_repo.py

      - name: the repository privacy scan
        run: python3 scripts/verify_repo.py .

  release:
    name: the release verification
    # The release gate: the whole sweep in release mode. Every check
    # has to run, and a check that cannot run is a failure rather than
    # a skip. This is the job that says whether a release is verified.
    # The matrix above says whether the application works on three
    # platforms.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config

      # The release verification refuses to run without the audit tool,
      # so it is installed here at the pinned version.
      - name: the pinned cargo-audit
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --version

      - name: the release verification
        run: bash scripts/verify.sh --release
