[package]
name = "agentops"
version = "0.1.2"
description = "AgentOps - a local, synthetic agent operations console."
edition = "2021"
# The true minimum, established by `cargo metadata` and verified by the
# MSRV job and by scripts/check_msrv.py. The tauri crate itself requires
# 1.90, so this cannot honestly be lower.
rust-version = "1.90"
license = "MIT"

[lib]
name = "agentops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
